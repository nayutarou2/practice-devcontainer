# ==============================================================================
# 1. ⚙️ アプリケーション基本設定
# ==============================================================================
spring.application.name=practice-devcontainer

# MyBatis 命名規則自動変換（created_at -> createdAt）
mybatis.configuration.map-underscore-to-camel-case=true

# ==============================================================================
# 2. 🐘 PostgreSQL 設定 (ローカル常時起動開発コンテナ直結)
# ==============================================================================
spring.datasource.driverClassName=org.postgresql.Driver

# 🌟【修正】接続先URLをバックエンドCompose内のコンテナ名「postgresdb」とデータベース名「mydatabase」に完全適合！
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresdb:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# 🌟【修正】実際のフォルダ構造「db/migration」に完全一致させ、空振りを防ぐ！
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

