# ==============================================================================
# 1. ⚙️ アプリケーション基本設定
# ==============================================================================
spring.application.name=practice-devcontainer

# MyBatis 命名規則自動変換（created_at -> createdAt）
mybatis.configuration.map-underscore-to-camel-case=true

# ==============================================================================
# 2. 🐘 PostgreSQL 設定 (ローカル常時起動開発コンテナ直結)
# ==============================================================================
spring.datasource.driverClassName=org.postgresql.Driver

# H2は完全廃止。開発時はローカルの「gacha-db」コンテナに接続します。
# 接続先URL、ユーザー名、パスワードは、ローカル環境に合わせて環境変数から注入するか、
# 未定義時のフォールバックとして安全に定義しておきます。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://gacha-db:5432/gachadb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Flyway マイグレーション設定（PostgreSQL用の移行ファイルに完全集約）
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true

# 開発時は起動時に自動マイグレーションを実行してスキーマを最新化
spring.flyway.enabled=true

# H2関連の設定（コンソール等）はセキュリティ・軽量化のため完全に削除しました

